function parse(t){return t.split(/^@@ /m).map(b=>b.trim()).filter(Boolean).map(b=>{const L=b.split('\n'),H=L.shift().split('|').map(s=>s.trim());return{id:uid(),semestre:H[0],module:H[1],stage:H[2],volume:H[3],objectif:H[4],items:L.filter(x=>x.trim()).map(l=>{const q=/^(##|#|-|>) (.*)$/.exec(l.trim()),c=q[1],t=q[2];return c==='#'?{t,k:'h',o:''}:c==='##'?{t,k:'g',o:''}:{t,r:false,m:false,o:'',l:c==='>'?1:0}})}})}
